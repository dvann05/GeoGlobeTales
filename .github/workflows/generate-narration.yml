name: Generate Indonesian Narration

on:
  workflow_dispatch:
    inputs:
      text:
        description: "Teks narasi bahasa Indonesia"
        required: true
        type: string
      speaker:
        description: "Pilihan suara"
        required: true
        type: choice
        options:
          - ardi
          - wibowo
          - gadis
        default: ardi
      filename:
        description: "Nama file tanpa ekstensi"
        required: true
        type: string
        default: narration

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install TTS engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/drat/TTS-Indonesia-Gratis.git"

      - name: Generate narration and subtitles
        env:
          TTS_TEXT: ${{ inputs.text }}
          TTS_SPEAKER: ${{ inputs.speaker }}
          TTS_FILENAME: ${{ inputs.filename }}
        run: |
          python scripts/generate_tts.py \
            --text "$TTS_TEXT" \
            --speaker "$TTS_SPEAKER" \
            --filename "$TTS_FILENAME"

      - name: Export narration metadata
        env:
          TTS_FILENAME: ${{ inputs.filename }}
        run: |
          python scripts/export_narration_module.py "$TTS_FILENAME"

      - name: Validate generated assets
        run: |
          node scripts/validate-assets.cjs

      - name: Save generated narration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- public/audio/narration src/projects/generated/narration.ts

          if ! git diff --cached --quiet; then
            git commit -m "Add generated Indonesian narration"
            git push
          else
            echo "No generated files to commit."
          fi
