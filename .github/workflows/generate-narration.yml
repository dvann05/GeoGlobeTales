name: Generate Indonesian Narration and Video

on:
  workflow_dispatch:
    inputs:
      text:
        description: "Teks narasi bahasa Indonesia"
        required: true
        type: string
      speaker:
        description: "Pilihan suara"
        required: true
        type: choice
        options:
          - ardi
          - wibowo
          - gadis
        default: ardi
      filename:
        description: "Nama file tanpa ekstensi"
        required: true
        type: string
        default: narration

permissions:
  contents: write

jobs:
  generate-and-render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install audio system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Generate Indonesian narration
        env:
          TTS_TEXT: ${{ inputs.text }}
          TTS_SPEAKER: ${{ inputs.speaker }}
          TTS_FILENAME: ${{ inputs.filename }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/drat/TTS-Indonesia-Gratis.git"
          python scripts/generate_tts.py \
            --text "$TTS_TEXT" \
            --speaker "$TTS_SPEAKER" \
            --filename "$TTS_FILENAME"

      - name: Export narration metadata
        env:
          TTS_FILENAME: ${{ inputs.filename }}
        run: |
          python scripts/export_narration_module.py "$TTS_FILENAME"

      - name: Validate narration assets
        run: node scripts/validate-assets.cjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install video dependencies
        run: npm ci

      - name: Prepare Remotion browser
        run: npx remotion browser ensure

      - name: Render narrated MP4
        run: |
          mkdir -p out
          npm run render

      - name: Save generated narration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- public/audio/narration src/projects/generated/narration.ts

          if ! git diff --cached --quiet; then
            git commit -m "Add generated Indonesian narration"
            git push
          fi

      - name: Upload finished video
        uses: actions/upload-artifact@v4
        with:
          name: GeoGlobeTales-20s-MP4
          path: out/video.mp4
          if-no-files-found: error
          retention-days: 7
